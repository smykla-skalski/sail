name: Desktop packages

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/package-release.mjs
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/Entitlements.plist
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
  workflow_dispatch:
    inputs:
      context_auth_514:
        description: Run the one-off signed private context auth fixture
        type: boolean
        default: false
      context_provider_553:
        description: Run the one-off signed private provider relay fixture
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || (!inputs.context_auth_514 && !inputs.context_provider_553)
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            target: macos-x64
            bundles: dmg
          - os: ubuntu-22.04
            target: linux-x64
            bundles: deb,appimage
          - os: windows-2022
            target: windows-x64
            bundles: nsis

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xvfb

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'SAIL_SIGNING_MODE=ad-hoc' >> "$GITHUB_ENV"
            /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.web-browser.public-key-credential' src-tauri/Entitlements.plist
          else
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
            certificate="$RUNNER_TEMP/sai-certificate.p12"
            keychain="$RUNNER_TEMP/sai-build.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
            security create-keychain -p "$keychain_password" "$keychain"
            security default-keychain -s "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -t 3600 -u "$keychain"
            security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
            echo 'SAIL_SIGNING_MODE=developer-id' >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi

      - name: Build development installer
        if: runner.os != 'macOS' || env.SAIL_SIGNING_MODE == 'ad-hoc'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci

      - name: Build and notarize Developer ID installer
        if: runner.os == 'macOS' && env.SAIL_SIGNING_MODE == 'developer-id'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Stage and hash installer
        run: node scripts/package-release.mjs stage ${{ matrix.target }}

      - name: Smoke test macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mountpoint="$RUNNER_TEMP/sai-mounted"
          mkdir -p "$mountpoint"
          hdiutil attach -quiet -nobrowse -mountpoint "$mountpoint" release-output/*.dmg
          trap 'hdiutil detach -quiet "$mountpoint"' EXIT
          apps=("$mountpoint"/*.app)
          test -d "${apps[0]}"
          codesign --verify --deep --strict "${apps[0]}"
          if [[ "$SAIL_SIGNING_MODE" == developer-id ]]; then
            entitlements="$RUNNER_TEMP/sail-entitlements.plist"
            codesign -d --entitlements - --xml "${apps[0]}" > "$entitlements"
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.web-browser.public-key-credential' "$entitlements")" = true
          fi
          app_copy="$RUNNER_TEMP/sai-smoke/$(basename "${apps[0]}")"
          mkdir -p "$(dirname "$app_copy")"
          ditto "${apps[0]}" "$app_copy"
          hdiutil detach -quiet "$mountpoint"
          trap - EXIT
          codesign --verify --deep --strict "$app_copy"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$app_copy/Contents/Info.plist")"
          "$app_copy/Contents/MacOS/$executable" &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i release-output/*.deb
          appimages=(release-output/*.AppImage)
          test "${#appimages[@]}" -eq 1
          chmod +x "${appimages[0]}"
          "${appimages[0]}" --appimage-extract >/dev/null
          set +e
          timeout 10 xvfb-run -a /usr/bin/sail
          exit_code=$?
          set -e
          test "$exit_code" -eq 124

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-output -Filter *.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'sai-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
          $app = Get-ChildItem $destination -Recurse -Filter sail.exe | Select-Object -First 1
          if (-not $app) { throw 'Installed app executable missing' }
          $running = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($running.HasExited) { throw "Installed app exited: $($running.ExitCode)" }
          Stop-Process -Id $running.Id -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: release-output/*
          if-no-files-found: error

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: release-output/Sail-*

  release:
    name: Development prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: downloaded

      - name: Verify versions, commits, and hashes
        run: node scripts/package-release.mjs verify downloaded

      - name: Publish labeled development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --prerelease --title "Sail $GITHUB_REF_NAME (development)" \
            --notes-file docs/release-notes.md

  context-auth-514:
    name: Signed private context auth fixture
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.context_auth_514 &&
      github.ref == 'refs/heads/feat/issue-514-macos-session-auth' && github.actor == 'Automaat'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure private fixture paths
        shell: bash
        run: |
          private="$RUNNER_TEMP/sail-514-$GITHUB_RUN_ID"
          {
            echo "SAIL_E2E_CONFIG_DIR=$private/config"
            echo "SAIL_TEST_SCRATCH=$private/test"
            echo "CARGO_TARGET_DIR=$private/target"
            echo "npm_config_cache=$private/npm-cache"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb9281d # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Import existing Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          private="$RUNNER_TEMP/sail-514-$GITHUB_RUN_ID"
          mkdir -p "$private"
          certificate="$private/certificate.p12"
          keychain="$private/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed private app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SAIL_E2E_CONFIG_DIR" "$SAIL_TEST_SCRATCH"
          npm run build:e2e
          apps=("$CARGO_TARGET_DIR"/debug/bundle/macos/*.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          test "$(codesign -dv --verbose=4 "${apps[0]}" 2>&1 | sed -n 's/^Signature=//p')" != 'adhoc'
          echo "SAIL_E2E_APP=${apps[0]}" >> "$GITHUB_ENV"

      - name: Exercise signed native sessions
        run: node test/context-auth-native.mjs

      - name: Remove private signing material and state
        if: always()
        shell: bash
        run: |
          private="$RUNNER_TEMP/sail-514-$GITHUB_RUN_ID"
          if [[ -n "$private" && "$private" == "$RUNNER_TEMP"/sail-514-* ]]; then
            security delete-keychain "$private/signing.keychain-db" 2>/dev/null || true
            rm -rf "$private"
          fi

  context-provider-553:
    name: Signed private provider relay fixture
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.context_provider_553 &&
      github.ref == 'refs/heads/feat/issue-553-provider-bridge' && github.actor == 'Automaat'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure private fixture paths
        shell: bash
        run: |
          private="$RUNNER_TEMP/sail-553-$GITHUB_RUN_ID"
          {
            echo "SAIL_E2E_CONFIG_DIR=$private/config"
            echo "SAIL_TEST_SCRATCH=$private/test"
            echo "CARGO_TARGET_DIR=$private/target"
            echo "npm_config_cache=$private/npm-cache"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Import existing Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          private="$RUNNER_TEMP/sail-553-$GITHUB_RUN_ID"
          mkdir -p "$private"
          certificate="$private/certificate.p12"
          keychain="$private/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed private app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SAIL_E2E_CONFIG_DIR" "$SAIL_TEST_SCRATCH"
          npm run build:e2e
          apps=("$CARGO_TARGET_DIR"/debug/bundle/macos/*.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          test "$(codesign -dv --verbose=4 "${apps[0]}" 2>&1 | sed -n 's/^Signature=//p')" != 'adhoc'
          echo "SAIL_E2E_APP=${apps[0]}" >> "$GITHUB_ENV"

      - name: Exercise signed provider relay
        run: node test/context-provider-native.mjs

      - name: Remove private signing material and state
        if: always()
        shell: bash
        run: |
          private="$RUNNER_TEMP/sail-553-$GITHUB_RUN_ID"
          if [[ -n "$private" && "$private" == "$RUNNER_TEMP"/sail-553-* ]]; then
            security delete-keychain "$private/signing.keychain-db" 2>/dev/null || true
            rm -rf "$private"
          fi
