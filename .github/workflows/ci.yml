name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Rust change detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.detect.outputs.rust }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Rust paths
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- src-tauri; then
            echo 'rust=false' >> "$GITHUB_OUTPUT"
          else
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: |
          npm run lint
          npm test
          npm run build

  context-eval-windows:
    name: Context eval (windows-2022)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test runner containment
        run: node --test test/context-eval-cli.test.ts

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: always() && !cancelled()
    runs-on: ${{ matrix.os }}
    env:
      RUN_RUST: ${{ github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]

    steps:
      - name: Skip unchanged Rust
        if: env.RUN_RUST != 'true'
        run: echo 'No Rust changes in this pull request'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_RUST == 'true'

      - name: Install Linux desktop dependencies
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: env.RUN_RUST == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.RUN_RUST == 'true'
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        if: env.RUN_RUST == 'true' && runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Lint Rust
        if: env.RUN_RUST == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust
        if: env.RUN_RUST == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
