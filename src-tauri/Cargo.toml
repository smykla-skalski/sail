[package]
name = "sail"
version = "0.1.0"
description = "Desktop workflow workspace for OpenCode"
authors = ["Marcin Skalski"]
edition = "2021"

[lib]
name = "sail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
notify-rust = "4.18.1"
portable-pty = "0.9.0"
shell-words = "1.1.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
nix = { version = "0.31", features = ["signal"] }
netstat2 = "0.11.2"
sysinfo = { version = "0.39.0", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
cairo-rs = { version = "0.22", features = ["png"] }
# WebKit2GTK's snapshot surface uses cairo-rs 0.18.
cairo-rs-gtk = { package = "cairo-rs", version = "0.18", features = ["png"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
